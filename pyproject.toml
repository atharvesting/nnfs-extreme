[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mnist-cv"
version = "0.1.0"
description = "Computer-vision hand-drawn digit capture and inference pipeline for NNFS Extreme"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.10",
  "mediapipe>=0.10.14",
  "pyserial>=3.5",
]
